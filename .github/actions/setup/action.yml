name: Setup workspace
description: >-
  pnpm + Node from .nvmrc and a frozen install. Every CI job starts here so
  the toolchain lives in one place. The Nx task cache is intentionally not
  persisted: since Nx 21 cache hits are looked up in a per-machine SQLite
  database (`.nx/workspace-data/<machine-id>-v2.db`), so restoring `.nx/cache`
  on a fresh runner never yields a hit — sharing it needs a remote cache.

inputs:
  registry-url:
    description: npm registry URL for setup-node (publish jobs only)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
