name: Benchmarks

# Smoke-run the benchmarks so they keep compiling and executing. Absolute
# timings are not gated — shared CI runners are too noisy for a stable
# threshold; baselines are tracked by running `pnpm bench` locally. Off the
# release path on purpose: weekly plus on demand.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Benchmarks
        run: pnpm bench
