<!doctype html>
<!-- `/docs/` (trailing slash) has no generated index: the pages route for
     `/docs` emits `docs.html`, which GitHub Pages serves only for the
     slash-less form. This static file covers the trailing-slash URL with
     the same redirect. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=/diagram/docs/introduction/installation" />
    <link
      rel="canonical"
      href="https://ohjustanother.site/diagram/docs/introduction/installation"
    />
    <title>Docs</title>
  </head>
  <body>
    <a href="/diagram/docs/introduction/installation">Documentation</a>
  </body>
</html>
