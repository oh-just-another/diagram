pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{ts,tsx,js,mjs,cjs,json,md,mdx,yml,yaml}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

# Fast local gate: only projects changed since origin/master (and their
# dependents) are built, typechecked, linted and tested, in one Nx run.
# The full workspace — coverage thresholds, bundle size, e2e — is CI's job.
pre-push:
  parallel: true
  commands:
    format:
      run: pnpm format:check
    affected:
      run: pnpm exec nx affected --base=origin/master --head=HEAD -t build,typecheck,lint,test
    deps:
      run: pnpm deps:check
    knip:
      run: pnpm knip
