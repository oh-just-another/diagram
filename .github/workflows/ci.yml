name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, refactor/v2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint • Typecheck • Test • Coverage • Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Layering gate (L0→L8, core purity, runtime cycles). Runs in the
      # pre-push hook locally, but forks without hooks bypass it, so it must
      # also gate PRs here.
      - name: Dependency graph check
        run: pnpm deps:check

      - name: Test
        run: pnpm test

      - name: Coverage gate
        run: pnpm test:coverage:gate

      - name: Build
        run: pnpm build

      # Smoke-run the benchmarks so they keep compiling and executing. Absolute
      # timings are not gated — shared CI runners are too noisy for a stable
      # threshold; baselines are tracked by running `pnpm bench` locally.
      # Only on push to master: the full sampling adds ~3.5 min and the smoke
      # value is low on every PR (typecheck already proves they compile), so we
      # keep it off the PR critical path and still catch breakage at merge.
      - name: Benchmarks
        if: github.event_name == 'push'
        run: pnpm bench

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(node -p "require('./apps/e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @oh-just-another/e2e exec playwright install chromium --with-deps

      # Screenshot specs are excluded: their baselines are captured locally
      # (macOS) and are not committed to the repo, so on a Linux runner
      # Playwright would treat every screenshot as a missing snapshot and
      # fail. Visual baselines stay a local-only check until per-platform
      # (linux) snapshots are recorded and committed.
      - name: Run e2e suite
        run: pnpm --filter @oh-just-another/e2e e2e --grep-invert "mobile UI screenshots"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/e2e/test-results/
          retention-days: 7
