version: 2
updates:
  # Workspace (pnpm): one grouped PR for dev tooling and one for runtime
  # dependencies per week, so alerts don't pile up between manual sweeps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Majors of the build system are migrated deliberately (nx migrate).
      - dependency-name: nx
        update-types: [version-update:semver-major]
      - dependency-name: "@nx/*"
        update-types: [version-update:semver-major]

  # Starter templates have no lockfile in the workspace; keep their pins fresh.
  - package-ecosystem: npm
    directory: /templates/nextjs
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /templates/vite-react
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
