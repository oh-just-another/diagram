name: Deploy docs + playground to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer master push supersedes a queued docs build; only the deploy
    # itself is never cancelled (workflow-level group above).
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build workspace packages
        # The docs site imports the built @oh-just-another/editor (and its deps)
        # via package `exports`, so the packages must be built before Docusaurus
        # bundles the site. baseUrl (/diagram/) is set in docusaurus.config.ts.
        run: pnpm build

      - name: Build docs site
        run: pnpm docs:build

      # The playground ships as a static sub-site of the same Pages deploy:
      # built with its base pointing at /diagram/playground/ and copied into
      # the docs build output. Collab stays offline there — the /relay dev
      # proxy has no Pages counterpart; set VITE_RELAY_URL once a public
      # relay exists.
      - name: Build playground
        run: pnpm --filter @oh-just-another/playground exec vite build --base=/diagram/playground/

      - name: Merge playground into the site
        run: |
          mkdir -p apps/docs/build/playground
          cp -R apps/playground/dist/. apps/docs/build/playground/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/build

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
