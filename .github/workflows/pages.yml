name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build apps/docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A newer master push supersedes a queued docs build; only the deploy
    # itself is never cancelled (workflow-level group above).
    concurrency:
      group: pages-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build workspace packages
        # The docs site imports the built @oh-just-another/editor (and its deps)
        # via package `exports`, so the packages must be built before Docusaurus
        # bundles the site. baseUrl (/diagram/) is set in docusaurus.config.ts.
        run: pnpm build

      - name: Build docs site
        run: pnpm docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/build

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
