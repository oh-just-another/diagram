name: Setup workspace
description: >-
  pnpm + Node from .nvmrc, frozen install, and the Nx task cache restored from
  the most recent run on this branch or master. Every CI job starts here so the
  toolchain and cache policy live in one place.

inputs:
  registry-url:
    description: npm registry URL for setup-node (publish jobs only)
    required: false
    default: ""

outputs:
  nx-cache-key:
    description: Exact key to save the Nx cache under after the job's work
    value: ${{ steps.nx-cache-key.outputs.key }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: "pnpm"
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # One unique key per job and run so the save steps never collide with an
    # existing entry; restore-keys fall back to the newest cache for the same commit,
    # then the newest cache this run is allowed to see (own branch, then
    # master — GitHub scopes caches by branch). Nx hashes every task by its
    # inputs, so a stale entry can only miss, never serve wrong output.
    - name: Compute Nx cache key
      id: nx-cache-key
      shell: bash
      run: echo "key=nx-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}" >> "$GITHUB_OUTPUT"

    - name: Restore Nx cache
      uses: actions/cache/restore@v4
      with:
        path: .nx/cache
        key: ${{ steps.nx-cache-key.outputs.key }}
        restore-keys: |
          nx-${{ runner.os }}-${{ github.sha }}-
          nx-${{ runner.os }}-
